[package]
name = "ilium-plugin-core-inference"
description = "Core plugin ilium.core.inference of Ilium (manual page core-plugin-inference.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# cdylib is the component build; rlib lets the FakeHost tests under tests/ link the plugin.
crate-type = ["cdylib", "rlib"]

[dependencies]
ilium-plugin-sdk = { version = "0.1.1", path = "../../../ilium-plugin-sdk" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
url = "2.5.7"

[dev-dependencies]
ilium-plugin-sdk = { version = "0.1.1", path = "../../../ilium-plugin-sdk", features = ["testing"] }
proptest = "1"

[features]
# Component builds (wasm32-wasip2): `#[ilium_plugin]` emits the component glue of one side.
# The two sides of a plugin are two components, so exactly one feature is set per build.
component-server = []
component-client = []
component-scene = []
