[package]
name = "ilium-plugin-core-scenes"
description = "Core plugin ilium.core.scenes of Ilium (manual page core-plugin-scenes.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# cdylib is the component build; rlib lets the FakeHost tests under tests/ link the plugin.
crate-type = ["cdylib", "rlib"]

[dependencies]
ilium-plugin-sdk = { version = "0.1.1", path = "../../../ilium-plugin-sdk" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
swash = "0.2.9"
# Provider timestamps and the Coinbase history plan; no clock feature, the host supplies the time.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Decodes the embedded elevation PNGs of the topographic maps scene and the satellite tiles of the clouds scene (pure Rust, builds for wasm).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga"] }
# The voxel landscape: texture-pack identity digests and ZIP member inflation (pure Rust, builds for wasm).
sha2 = "=0.10.9"
flate2 = "1.1.9"

[dev-dependencies]
ilium-plugin-sdk = { version = "0.1.1", path = "../../../ilium-plugin-sdk", features = ["testing"] }
serde_json = "1.0.151"
proptest = "1"
tempfile = "3.27.0"

[features]
# Component builds (wasm32-wasip2): `#[ilium_plugin]` emits the component glue of one side.
# The two sides of a plugin are two components, so exactly one feature is set per build.
component-server = []
component-client = []
component-scene = []
