[package]
name = "ilium-plugin-fixture-conformance-probe"
description = "Guest fixture component conformance-probe (test-plan.md section 1.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ilium-plugin-sdk = { version = "0.1.1", path = "../../../ilium-plugin-sdk" }

[features]
# Component builds (wasm32-wasip2): `#[ilium_plugin]` emits the component glue of one side.
# The two sides of a plugin are two components, so exactly one feature is set per build.
component-server = []
component-client = []
component-scene = []
