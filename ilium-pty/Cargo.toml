[package]
name = "ilium-pty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.103"
crossterm = "0.29.0"
# Native transport, cancellation, worker ownership and process probes.
ilium-platform = { version = "0.1.0", path = "../ilium-platform" }
portable-pty = "0.9.0"
thiserror = "2.0.18"
tracing = "0.1.44"
tokio = { version = "1", features = ["sync"] }
vt100 = "0.16.2"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
