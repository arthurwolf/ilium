[package]
name = "ilium-ambient"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
cosmic-text = "0.14"
cpal = "0.18.1"
directories = "6.0.0"
flate2 = "1.1.9"
png = "=0.18.1"
fdeflate = "=0.3.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tga"] }
cap-std = "=4.0.3"
ilium-platform = { path = "../ilium-platform" }
ilium-execution = { path = "../ilium-execution" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "=0.10.9"
thiserror = "2.0.18"
tracing = "0.1.44"
ureq = { version = "3.2.0", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
