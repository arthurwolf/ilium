[package]
name = "ilium-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ilium-http = { version = "0.1.0", path = "../ilium-http" }
ilium-prompts = { version = "0.1.0", path = "../ilium-prompts" }
ilium-kilo-gateway = { version = "0.1.0", path = "../ilium-kilo-gateway" }
ilium-logging = { version = "0.1.0", path = "../ilium-logging" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1.44"
ureq = { version = "3.2.0", features = ["json"] }
url = "2.5.7"

[dev-dependencies]
ilium-execution = { version = "0.1.0", path = "../ilium-execution" }
ilium-platform = { version = "0.1.0", path = "../ilium-platform" }
tempfile = "3.27.0"
