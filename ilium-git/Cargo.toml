[package]
name = "ilium-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ilium-platform = { version = "0.1.1", path = "../ilium-platform" }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["io-util", "macros", "process", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
