name: diag-vs2022
# Temporary diagnostic: VS 2022 Build Tools on windows-2025 satisfy the ORT builder's discovery.
on: workflow_dispatch
jobs:
    vs:
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
            - shell: pwsh
              run: |
                  choco install visualstudio2022buildtools -y --no-progress --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --quiet --norestart --wait"
                  "choco exit: $LASTEXITCODE"
                  $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                  & $vswhere -latest -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                  New-Item -ItemType Directory -Force t | Out-Null
                  Set-Content t/CMakeLists.txt "cmake_minimum_required(VERSION 3.20)`nproject(x CXX)`nadd_executable(x x.cpp)"
                  Set-Content t/x.cpp "int main(){return 0;}"
                  cmake -S t -B tb -G "Visual Studio 17 2022" -A x64
                  cmake --build tb --config Release
            - shell: python
              run: |
                  import sys, tempfile
                  sys.path.insert(0, 'release/scripts')
                  import build_windows_ort as b
                  with tempfile.TemporaryDirectory() as d:
                      print(b.resolve_msvc_toolchain(d))
