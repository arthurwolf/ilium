name: diag-windows-pty
# Temporary diagnostic: does pty_tui_smoke pass on windows-2022 now?
on: workflow_dispatch
jobs:
    pty:
        runs-on: windows-2022
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
            - uses: Swatinem/rust-cache@v2
            - run: cargo build --workspace --all-targets
            - run: cargo test -p ilium --test pty_tui_smoke --no-fail-fast
