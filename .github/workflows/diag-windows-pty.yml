name: diag-windows-pty
# Temporary diagnostic: does pty_tui_smoke depend on the Windows runner image?
on: workflow_dispatch
jobs:
    pty:
        strategy:
            fail-fast: false
            matrix:
                image: [windows-2022, windows-2025]
        runs-on: ${{ matrix.image }}
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
            - uses: Swatinem/rust-cache@v2
            - run: cargo build --workspace --all-targets
            - run: cargo test -p ilium --test pty_tui_smoke --no-fail-fast
