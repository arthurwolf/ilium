# Preview publication has independent evidence; it never bypasses stable gates.
name: Complete preview GHCR asset bundle
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Exact successful release.yml native qualification run
        required: true
        type: string
      qualified_source_sha:
        description: Full commit qualified by that run and immutable preview.7 tag
        required: true
        type: string
      publish:
        description: Publish after all source, native and public download checks
        default: false
        type: boolean
permissions:
  contents: read
env:
  # The checkout must stay clean: tracked bytecode files are audited as source.
  PYTHONDONTWRITEBYTECODE: '1'
concurrency:
  group: ilium-preview7-ghcr
  cancel-in-progress: false
jobs:
  preview-bundle:
    if: github.ref == 'refs/heads/release/v0.1.1-preview.7'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      NATIVE_RUN_ID: ${{ inputs.native_run_id }}
      QUALIFIED_SOURCE_SHA: ${{ inputs.qualified_source_sha }}
      CURRENT_SOURCE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate exact native run and export only its retained artifact IDs
        id: native
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          python release/scripts/preview_qualification.py run
          --run-id "$NATIVE_RUN_ID" --source-sha "$QUALIFIED_SOURCE_SHA"
          --current-sha "$CURRENT_SOURCE_SHA" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.native.outputs.native_macos_intel_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-evidence/native-macos-intel
          github-token: ${{ github.token }}
          run-id: ${{ inputs.native_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.native.outputs.packages_macos_intel_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-evidence/packages-macos-intel
          github-token: ${{ github.token }}
          run-id: ${{ inputs.native_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.native.outputs.native_linux_arm64_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-evidence/native-linux-arm64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.native_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.native.outputs.packages_linux_arm64_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-evidence/packages-linux-arm64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.native_run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.native.outputs.windows_installer_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-evidence/windows-installer
          github-token: ${{ github.token }}
          run-id: ${{ inputs.native_run_id }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.0
      - name: Verify complete public preview or explicitly publish its identical GHCR bundle
        env:
          PUBLISH: ${{ inputs.publish }}
          GHCR_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          mode=verify
          if test "$PUBLISH" = true; then mode=publish; fi
          python release/scripts/publish_preview_ghcr.py "$mode" \
            --run-id "$NATIVE_RUN_ID" --source-sha "$QUALIFIED_SOURCE_SHA" \
            --current-sha "$CURRENT_SOURCE_SHA" \
            --artifacts "$RUNNER_TEMP/native-evidence" --payload "$RUNNER_TEMP/public-preview-assets" \
            --output "$RUNNER_TEMP/preview-ghcr-result.json" --intent "$RUNNER_TEMP/preview-ghcr-intent.json"
      - name: Retain exact preview qualification, registry intent and digest-bound result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-ghcr-evidence
          path: |
            ${{ runner.temp }}/preview-ghcr-result.json
            ${{ runner.temp }}/preview-ghcr-intent.json
            ${{ runner.temp }}/preview-ghcr-qualification.json
          if-no-files-found: warn
          retention-days: 30
