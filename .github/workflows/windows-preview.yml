# Qualification only: builds, packages and smoke-tests Windows x86_64 natively on windows-2025.
# Nothing here publishes; the verified artifacts are published by hand with the Linux and macOS files.
name: Windows x86_64 preview qualification
'on':
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Windows Visual Studio 2022 Build Tools (the pinned ORT source build needs VS 17; windows-2025 ships only VS 18)
      shell: pwsh
      run: |
        $maximumAttempts = 4
        for ($attempt = 1; $attempt -le $maximumAttempts; $attempt++) {
          $installOutput = & choco install visualstudio2022buildtools -y --no-progress --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --quiet --norestart --wait" 2>&1
          $installExitCode = $LASTEXITCODE
          $installOutput | ForEach-Object { Write-Host $_ }
          if ($installExitCode -in 0, 3010) { break }
          $outputText = $installOutput -join "`n"
          $transientFeedFailure = $outputText -match '(?i)(HTTP\s*(429|5\d\d)|Response status code.*\b(429|5\d\d)\b|Service Unavailable|temporarily unavailable|timed out|connection reset|name resolution)'
          if (-not $transientFeedFailure -or $attempt -eq $maximumAttempts) {
            throw "Build Tools install failed with exit $installExitCode on attempt $attempt of $maximumAttempts"
          }
          $delaySeconds = 15 * [Math]::Pow(2, $attempt - 1)
          Write-Host "Chocolatey feed failure; retrying in $delaySeconds seconds (attempt $($attempt + 1) of $maximumAttempts)."
          Start-Sleep -Seconds $delaySeconds
        }
        if ($installExitCode -notin 0, 3010) { throw "Build Tools install failed: $installExitCode" }
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $found = & $vswhere -latest -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $found) { throw "No Visual Studio 2022 installation after the Build Tools install" }
        "Visual Studio 2022: $found"
    - name: Pinned release test parser
      run: python -m pip install PyYAML==6.0.2
    - name: Pinned Windows ORT static-CRT source-builder contract
      run: |
        python release/scripts/build_windows_ort.py --help
        python -m unittest release.tests.test_build_windows_ort
    - name: Windows product build, tests, licence closure and candidate audit
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python release/scripts/release_pipeline.py native --qualification-profile windows-x86-preview --tag "${{ inputs.release_tag }}" --target "x86_64-pc-windows-msvc" --runner-identity "windows-2025" --work "$RUNNER_TEMP/native-work" --output "$GITHUB_WORKSPACE/native-output"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-x86_64-pc-windows-msvc
        path: native-output/
        if-no-files-found: error
        retention-days: '30'
    - name: Retain native failure evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: diagnostics-x86_64-pc-windows-msvc
        path: |
          ${{ runner.temp }}/native-work/*.log
          ${{ runner.temp }}/native-work/*/*.log
          ${{ runner.temp }}/native-work/*/*.json
        if-no-files-found: warn
        retention-days: '30'
  windows-installers:
    needs:
    - native
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-x86_64-pc-windows-msvc
        path: native-windows
    - name: Pinned installer toolchain
      run: |
        dotnet tool install --global wix --version 5.0.2
        "$USERPROFILE/.dotnet/tools/wix" extension add --global WixToolset.Util.wixext/5.0.2
        choco install innosetup --version=6.5.4 --allow-downgrade --no-progress -y
        echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
    - name: Build per-user MSI and setup EXE from the audited ZIP
      run: python release/scripts/build_windows_installers.py build --tag "${{ inputs.release_tag }}" --archive native-windows/ilium-windows-x86_64.zip --work "$RUNNER_TEMP/installer-work" --output windows-installers
    - name: Silent install, run and uninstall both packages (add-on animations must be refused)
      run: python release/scripts/build_windows_installers.py smoke --tag "${{ inputs.release_tag }}" --installers windows-installers --archive native-windows/ilium-windows-x86_64.zip --audit-report native-windows/native-audit.json --manifest release/targets.toml --animation-contract refusal --log "$RUNNER_TEMP/installer-smoke"
    - name: Seal native installer evidence
      run: python release/scripts/validate_animation_smoke.py --workspace Cargo.toml --manifest release/targets.toml --target x86_64-pc-windows-msvc --tag "${{ inputs.release_tag }}" --audit native-windows/native-audit.json --archive native-windows/ilium-windows-x86_64.zip --packages windows-installers --animation-contract refusal --windows-journal "$RUNNER_TEMP/installer-smoke/smoke.jsonl"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: windows-installers
        path: windows-installers/
        if-no-files-found: error
        retention-days: '30'
    - name: Retain installer logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: diagnostics-windows-installers
        path: |
          ${{ runner.temp }}/installer-work/
          ${{ runner.temp }}/installer-smoke/
        if-no-files-found: warn
        retention-days: '30'
