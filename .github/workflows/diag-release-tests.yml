name: diag-release-tests
# Temporary diagnostic: the release python tests on a Windows runner.
on: workflow_dispatch
jobs:
    t:
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
            - run: python -m pip install PyYAML==6.0.2
            - run: python -m unittest discover -s release/tests -p "test_*.py"
