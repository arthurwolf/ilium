name: diag-release-tests
# Temporary diagnostic: the release python tests on a Windows runner.
on: workflow_dispatch
jobs:
    t:
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
            - run: python -m pip install PyYAML==6.0.2
            - shell: pwsh
              run: |
                  $bad = 0
                  foreach ($f in Get-ChildItem release/tests/test_*.py | Where-Object { $_.Name -ne 'test_posix_install.py' }) {
                      python -m unittest discover -s release/tests -p $f.Name
                      if ($LASTEXITCODE -ne 0) { "MODULE FAILED: $($f.Name)"; $bad = 1 }
                  }
                  exit $bad
