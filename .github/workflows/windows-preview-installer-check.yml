# Manual source qualification only. This never publishes assets or executes the
# production Pages installer; the checked-out candidate downloads preview.6.
name: Windows preview PowerShell installer check
'on':
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    if: github.repository == 'arthurwolf/ilium' && github.ref == 'refs/heads/release/v0.1.1-preview.7'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Check Windows installer source and published preview pin
      run: python -m unittest release.tests.test_windows_install_source
    - name: Install pinned Pester for the disposable runner account
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
    - name: PowerShell 5.1 installer transaction and preview tests
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        Import-Module Pester -RequiredVersion 5.7.1 -Force
        $result = Invoke-Pester -Path release/tests/Install.Tests.ps1 -Output Detailed -PassThru
        if ($result.FailedCount -gt 0 -or $result.PassedCount -lt 1) { throw 'Windows PowerShell installer tests failed.' }
    - name: PowerShell 7 installer transaction and preview tests
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Import-Module Pester -RequiredVersion 5.7.1 -Force
        $result = Invoke-Pester -Path release/tests/Install.Tests.ps1 -Output Detailed -PassThru
        if ($result.FailedCount -gt 0 -or $result.PassedCount -lt 1) { throw 'PowerShell 7 installer tests failed.' }
    - name: Install and remove the published preview using the candidate source
      shell: powershell
      run: |
        & ./release/tests/Test-WindowsPreviewInstaller.ps1 -Installer ./release/install.ps1 -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'ilium-installer-check')
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Retain native installer result
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: windows-preview-powershell-installer-check
        path: ${{ runner.temp }}/ilium-installer-check/receipt.json
        if-no-files-found: warn
        retention-days: '30'
