name: cgroup probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: probe
        run: |
          uname -r; id -u; stat -fc %T /sys/fs/cgroup
          show() { cat /proc/self/cgroup; p=/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup); while [ "$p" != /sys/fs/cgroup ]; do echo "$p: $(cat $p/cgroup.subtree_control 2>&1) procs-writable=$([ -w $p/cgroup.procs ] && echo y || echo n)"; p=$(dirname $p); done; echo "root: $(cat /sys/fs/cgroup/cgroup.subtree_control)"; }
          echo "== user scope Delegate=yes"; systemd-run --user --wait --pipe --collect --property=Delegate=yes bash -c "$(declare -f show); show"
          echo "== system scope Delegate=cpu memory pids"; sudo -n systemd-run --uid=$(id -u) --gid=$(id -g) --wait --pipe --collect --property="Delegate=cpu memory pids" --property=CPUAccounting=yes --property=MemoryAccounting=yes --property=TasksAccounting=yes bash -c "$(declare -f show); show"
          echo "== system scope Delegate=yes root"; sudo -n systemd-run --wait --pipe --collect --property=Delegate=yes bash -c "$(declare -f show); show"
          echo "== user scope after set-property"; sudo systemctl set-property --runtime user@$(id -u).service Delegate="cpu memory pids" || true
          systemd-run --user --wait --pipe --collect --property=Delegate=yes --property=CPUAccounting=yes bash -c "$(declare -f show); show"
