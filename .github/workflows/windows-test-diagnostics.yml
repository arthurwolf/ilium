# Scratch flake meter for the v0.1.1-preview.6 Windows PTY smoke tests: builds the
# pty_tui_smoke harness once per lane, then runs it repeatedly and records each
# iteration's result and failing tests. Not part of the release pipeline.
name: Windows test diagnostics (scratch)
'on':
  push:
    branches: [ci/windows-tests-preview6]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
jobs:
  flake-meter:
    runs-on: windows-2025
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        lane: [parallel, serial]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Toolchain
      run: rustup show active-toolchain || rustup toolchain install
    - name: Build the PTY smoke harness
      run: cargo test --locked --target x86_64-pc-windows-msvc --package ilium --test pty_tui_smoke --no-run
    - name: Run the PTY smoke harness repeatedly
      run: python ci/flake_meter.py "$RUNNER_TEMP/flake-logs" --lane ${{ matrix.lane }} --iterations ${{ matrix.lane == 'serial' && 5 || 8 }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: flake-${{ matrix.lane }}
        path: ${{ runner.temp }}/flake-logs
