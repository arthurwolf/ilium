# Scratch flake meter for the v0.1.1-preview.6 Windows PTY smoke tests: builds the
# harness once per lane, then runs it repeatedly and records each iteration's
# result, failing tests, leftover processes and raw PTY dumps of failures.
# Not part of the release pipeline.
name: Windows test diagnostics (scratch)
'on':
  push:
    branches: [ci/windows-tests-preview6]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
jobs:
  clippy:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - name: Toolchain
      run: rustup show active-toolchain || rustup toolchain install
    - name: Clippy (warnings as errors, Windows target)
      run: cargo clippy --locked --workspace --exclude 'ilium-plugin-*' --all-targets --keep-going --target x86_64-pc-windows-msvc -- -D warnings
  flake-meter:
    runs-on: windows-2025
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
        - {lane: solo, replica: 1, iterations: 12, args: '--exact universal_settings_catalog_and_exact_number_survive_fresh_client_reload'}
        - {lane: lock-default, replica: 1, iterations: 6, args: ''}
        - {lane: lock-default, replica: 2, iterations: 6, args: ''}
        - {lane: lock-one-thread, replica: 1, iterations: 6, args: '--threads 1'}
        - {lane: lock-one-thread, replica: 2, iterations: 6, args: '--threads 1'}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Toolchain
      run: rustup show active-toolchain || rustup toolchain install
    - name: Build the workspace binaries and the PTY smoke harness
      run: |
        cargo build --locked --workspace --exclude 'ilium-plugin-*' --bins --target x86_64-pc-windows-msvc
        cargo test --locked --target x86_64-pc-windows-msvc --package ilium --test pty_tui_smoke --no-run
    - name: Run the PTY smoke harness repeatedly
      run: python ci/flake_meter.py "$RUNNER_TEMP/flake-logs" --lane ${{ matrix.lane }} --iterations ${{ matrix.iterations }} ${{ matrix.args }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: flake-${{ matrix.lane }}-${{ matrix.replica }}
        path: ${{ runner.temp }}/flake-logs
  width-census:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - name: Toolchain
      run: rustup show active-toolchain || rustup toolchain install
    - name: vt100 replay of recorded ConPTY output and conhost glyph width census
      run: |
        mkdir -p "$RUNNER_TEMP/census"
        cargo test --locked --target x86_64-pc-windows-msvc -p ilium-pty --test scratch_conpty_replay --test scratch_conhost_widths -- --nocapture --test-threads 1 2>&1 | tee "$RUNNER_TEMP/census/output.txt"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: width-census
        path: ${{ runner.temp }}/census
  linux-format-and-vt100:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - name: Toolchain
      run: rustup show active-toolchain || rustup toolchain install
    - name: Format check
      run: cargo fmt --all --check && cargo fmt --manifest-path vendor/vt100/Cargo.toml --check
    - name: Vendored vt100 unit tests
      run: cargo test --locked --manifest-path vendor/vt100/Cargo.toml --lib
