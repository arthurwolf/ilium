# Scratch diagnostics for the v0.1.1-preview.6 Windows test gate: runs every test stage
# even after a failure and uploads all logs. Not part of the release pipeline.
name: Windows test diagnostics (scratch)
'on':
  push:
    branches: [ci/windows-tests-preview6]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  tests:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Toolchain
      run: rustup show active-toolchain || rustup toolchain install
    - name: Clippy (warnings as errors, Windows target)
      run: cargo clippy --locked --workspace --exclude 'ilium-plugin-*' --all-targets --keep-going --target x86_64-pc-windows-msvc -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1; status=$?; mkdir -p "$RUNNER_TEMP/test-logs"; mv "$RUNNER_TEMP/clippy.log" "$RUNNER_TEMP/test-logs/"; echo "clippy exit $status"
    - name: Unit, doc and integration tests (keep going)
      run: python ci/gate_tests.py . "$RUNNER_TEMP/test-logs" --target x86_64-pc-windows-msvc
    - name: Pester installer tests
      if: always()
      shell: pwsh
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
        Import-Module Pester -RequiredVersion 5.7.1 -Force
        Invoke-Pester -Path release/tests/Install.Tests.ps1 -Output Detailed *> "$env:RUNNER_TEMP/test-logs/pester.log"
        & pwsh -NoProfile -File release/tests/Test-WindowsInstallerContracts.ps1 *> "$env:RUNNER_TEMP/test-logs/installer-contracts.log"
        exit 0
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: windows-test-logs
        path: ${{ runner.temp }}/test-logs
  linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev pkg-config libssl-dev bubblewrap
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Toolchain
      run: rustup show active-toolchain || rustup toolchain install
    - name: Unit, doc and integration tests (keep going)
      run: python ci/gate_tests.py . "$RUNNER_TEMP/test-logs"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: linux-test-logs
        path: ${{ runner.temp }}/test-logs
