# Action commits read back from official GitHub tag refs on 2026-09-29.
# workflow_dispatch is strictly nonpublishing. Automatic native receipts replace
# manual qualification. Latest activation precedes literal default-command tests
# because those commands resolve /releases/latest; five default-preview installs
# gate production deployment; five literal production commands gate completion.
name: Native release and installation
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag matching workspace version; dispatch never publishes
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ilium-native-release-publication
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Manifest and source identity
      run: python release/scripts/release_pipeline.py source --tag "$RELEASE_TAG"
      id: identity
      env:
        RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    - name: Release contracts
      run: 'python -m pip install PyYAML==6.0.2

        python -m unittest discover -s release/tests -p "test_*.py"'
    outputs:
      matrix: ${{ steps.identity.outputs.matrix }}
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
  native:
    needs:
    - source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Linux native build prerequisites
      run: 'sudo apt-get update

        sudo apt-get install -y libasound2-dev pkg-config libssl-dev'
      if: matrix.os == 'linux'
    - name: Windows Visual Studio 2022 Build Tools (the pinned ORT source build needs VS 17; windows-2025 ships only VS 18)
      if: matrix.os == 'windows'
      shell: pwsh
      run: |
        choco install visualstudio2022buildtools -y --no-progress --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --quiet --norestart --wait"
        if ($LASTEXITCODE -notin 0, 3010) { throw "Build Tools install failed: $LASTEXITCODE" }
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $found = & $vswhere -latest -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $found) { throw "No Visual Studio 2022 installation after the Build Tools install" }
        "Visual Studio 2022: $found"
    - name: Pinned release test parser
      run: python -m pip install PyYAML==6.0.2
    - name: Pinned Windows ORT static-CRT source-builder contract
      if: matrix.os == 'windows'
      run: |
        python release/scripts/build_windows_ort.py --help
        python -m unittest release.tests.test_build_windows_ort
    - name: Full native build, tests, licence closure and candidate audit
      run: python release/scripts/release_pipeline.py native --tag "${{ needs.source.outputs.tag }}" --target "${{
        matrix.rust_target }}" --runner-identity "${{ matrix.runner }}" --work "$RUNNER_TEMP/native-work" --output
        "$GITHUB_WORKSPACE/native-output"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-${{ matrix.rust_target }}
        path: native-output/
        if-no-files-found: error
        retention-days: 30
    - name: Retain native failure evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: diagnostics-${{ matrix.rust_target }}
        path: |
          ${{ runner.temp }}/native-work/*.log
          ${{ runner.temp }}/native-work/*/*.log
          ${{ runner.temp }}/native-work/*/*.json
        if-no-files-found: warn
        retention-days: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
  windows-installers:
    needs:
    - source
    - native
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-x86_64-pc-windows-msvc
        path: native-windows
    - name: Pinned installer toolchain
      run: |
        dotnet tool install --global wix --version 5.0.2
        choco install innosetup --version=6.5.4 --no-progress -y
        echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
    - name: Build per-user MSI and setup EXE from the audited ZIP
      run: python release/scripts/build_windows_installers.py build --tag "${{ needs.source.outputs.tag }}" --archive
        native-windows/ilium-windows-x86_64.zip --work "$RUNNER_TEMP/installer-work" --output windows-installers
    - name: Silent install, run and uninstall both packages
      run: python release/scripts/build_windows_installers.py smoke --tag "${{ needs.source.outputs.tag }}" --installers
        windows-installers --log "$RUNNER_TEMP/installer-smoke"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: windows-installers
        path: windows-installers/
        if-no-files-found: error
        retention-days: 30
    - name: Retain installer logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: diagnostics-windows-installers
        path: ${{ runner.temp }}/installer-smoke/
        if-no-files-found: warn
        retention-days: 30
  linux-packages:
    needs:
    - source
    - native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          rust_target: x86_64-unknown-linux-gnu
          runner: ubuntu-22.04
        - arch: aarch64
          rust_target: aarch64-unknown-linux-gnu
          runner: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-${{ matrix.rust_target }}
        path: native-linux
    - name: Packaging toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm squashfs-tools flatpak fuse3
    - name: Build deb, rpm, AppImage, Flatpak and Snap from the audited tarball
      run: python release/scripts/build_linux_packages.py build --tag "${{ needs.source.outputs.tag }}" --arch "${{ matrix.arch
        }}" --archive "native-linux/ilium-linux-${{ matrix.arch }}.tar.gz" --work "$RUNNER_TEMP/package-work" --output linux-packages
    - name: Unpack every package and compare its payload with the audited files
      run: python release/scripts/smoke_linux_packages.py inspect --arch "${{ matrix.arch }}" --packages linux-packages
    - name: Install and run deb, rpm and AppImage in distribution containers
      run: python release/scripts/smoke_linux_packages.py containers --arch "${{ matrix.arch }}" --packages linux-packages
        --formats deb,rpm,appimage --log "$RUNNER_TEMP/package-smoke"
    - name: Install and run Snap, Flatpak, deb and the AppImage FUSE mount on the disposable runner
      run: python release/scripts/smoke_linux_packages.py host --arch "${{ matrix.arch }}" --packages linux-packages
        --formats snap,flatpak,deb,appimage --log "$RUNNER_TEMP/package-smoke-host"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: linux-packages-${{ matrix.arch }}
        path: linux-packages/
        if-no-files-found: error
        retention-days: 30
    - name: Retain package logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: diagnostics-linux-packages-${{ matrix.arch }}
        path: |
          ${{ runner.temp }}/package-smoke/
          ${{ runner.temp }}/package-smoke-host/
        if-no-files-found: warn
        retention-days: 30
  aggregate:
    needs:
    - source
    - native
    - windows-installers
    - linux-packages
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: native-*
        path: native-artifacts
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: windows-installers
        path: windows-installers
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: linux-packages-*
        path: linux-packages
        merge-multiple: true
    - name: Assemble exact five archives, Windows installers, Linux packages and installer/site bytes
      run: python release/scripts/release_pipeline.py aggregate --tag "${{ needs.source.outputs.tag }}" --artifacts
        native-artifacts --windows-installers windows-installers --linux-packages linux-packages --output candidate
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: candidate
        path: candidate/
        if-no-files-found: error
        retention-days: 30
  candidate-installs:
    needs:
    - source
    - aggregate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: candidate
        path: candidate
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-${{ matrix.rust_target }}
        path: native-output
    - name: Installed pair and real PTY acceptance
      run: python release/scripts/release_pipeline.py install --candidate candidate --native native-output --target
        "${{ matrix.rust_target }}" --mode candidate --output "$RUNNER_TEMP/install-result/receipt.json" --log "$RUNNER_TEMP/install-candidate.log"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: install-${{ matrix.rust_target }}
        path: ${{ runner.temp }}/install-result/
        if-no-files-found: error
        retention-days: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
  local-qualification:
    needs:
    - source
    - aggregate
    - candidate-installs
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: candidate
        path: candidate
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: install-*
        path: install-receipts
    - name: Bind all five native installs to source and archive hashes
      run: python release/scripts/release_pipeline.py qualify --candidate candidate --receipts install-receipts
        --output candidate/qualification.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: qualified-candidate
        path: candidate/
        if-no-files-found: error
        retention-days: 30
  attest:
    needs:
    - source
    - aggregate
    - candidate-installs
    - local-qualification
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualified-candidate
        path: candidate
    - name: Attest exact immutable candidate assets
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
      with:
        subject-path: 'candidate/*.tar.gz

          candidate/*.zip

          candidate/*.msi

          candidate/*.exe

          candidate/windows-installers.json

          candidate/*.deb

          candidate/*.rpm

          candidate/*.AppImage

          candidate/*.flatpak

          candidate/*.snap

          candidate/linux-packages-*.json

          candidate/SHA256SUMS

          candidate/VERSION

          candidate/install.sh

          candidate/install.ps1

          candidate/candidate.json

          candidate/qualification.json'
    if: github.event_name == 'push'
  draft:
    needs:
    - source
    - local-qualification
    - attest
    - baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualified-candidate
        path: candidate
    - name: Create draft once and read back exact asset digests
      run: python release/scripts/release_pipeline.py draft --candidate candidate --output draft-evidence/draft-receipt.json
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: draft-receipt
        path: draft-evidence/
        if-no-files-found: error
        retention-days: 30
      if: always()
    if: github.event_name == 'push'
  qualify:
    needs:
    - source
    - candidate-installs
    - local-qualification
    - draft
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualified-candidate
        path: candidate
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: install-*
        path: install-receipts
    - name: Independent archive and native-receipt reconstruction
      run: 'python -m pip install PyYAML==6.0.2

        python -m unittest discover -s release/tests -p test_workflow.py

        python release/scripts/release_pipeline.py qualify --candidate candidate --receipts install-receipts --output
        final-qualification.json

        cmp candidate/qualification.json final-qualification.json'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: final-qualification
        path: final-qualification.json
        if-no-files-found: error
        retention-days: 30
    if: github.event_name == 'push'
    environment: release-qualification
  publish:
    needs:
    - source
    - qualify
    - draft
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualified-candidate
        path: candidate
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: draft-receipt
        path: draft-evidence
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: final-qualification
        path: final-evidence
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: channel-baseline
        path: baseline
    - name: Publish once, require immutable=true and all digests
      run: 'cmp candidate/qualification.json final-evidence/final-qualification.json

        python release/scripts/release_pipeline.py publish --candidate candidate --draft-receipt draft-evidence/draft-receipt.json
        --baseline baseline --output publication-evidence/publication-receipt.json'
      env: &id001
        GH_TOKEN: ${{ github.token }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: publication-receipt
        path: publication-evidence/
        if-no-files-found: error
        retention-days: 30
      if: always()
    if: github.event_name == 'push'
  github-installs:
    needs:
    - source
    - publish
    - local-qualification
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualified-candidate
        path: candidate
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-${{ matrix.rust_target }}
        path: native-output
    - name: Installed pair and real PTY acceptance
      run: python release/scripts/release_pipeline.py install --candidate candidate --native native-output --target
        "${{ matrix.rust_target }}" --mode github --output "$RUNNER_TEMP/install-result/receipt.json" --log "$RUNNER_TEMP/install-github.log"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: github-install-${{ matrix.rust_target }}
        path: ${{ runner.temp }}/install-result/
        if-no-files-found: error
        retention-days: 30
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
  latest:
    needs:
    - source
    - github-installs
    - publish
    - local-qualification
    - pages-preview
    - preview-tag-qualification
    - previous-qualification
    - recovery-ready
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualified-candidate
        path: candidate
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: publication-receipt
        path: published
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: github-install-*
        path: github-receipts
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: channel-baseline
        path: baseline
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: recovery-ready
        path: recovery-ready
    - name: Promote latest after five pinned GitHub installs
      run: python release/scripts/release_pipeline.py latest --candidate candidate --receipts github-receipts --publication-receipt
        published/publication-receipt.json --baseline baseline --recovery-ready recovery-ready --output latest-evidence/latest-receipt.json
        --receipt-prefix github-install-
      env: *id001
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: latest-receipt
        path: latest-evidence/
        if-no-files-found: error
        retention-days: 30
      if: always()
    if: github.event_name == 'push'
  pages-preview:
    needs:
    - source
    - local-qualification
    - github-installs
    - baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
