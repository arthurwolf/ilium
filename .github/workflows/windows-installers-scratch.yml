# Scratch lane: rebuild and smoke the Windows installers from the audited native
# artifact of release run 43550255777, without a 2-hour native rebuild. Never merged.
# The smoke log root is shortened to D:/s because the audited native artifact predates the
# Windows socket-path-limit fix; the release run validates that fix at the full path.
name: Windows installers (scratch)
'on':
  push:
    branches: [ci/windows-installers-preview6]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  windows-installers:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
        ref: ${{ github.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-x86_64-pc-windows-msvc
        path: native-windows
        run-id: '43550255777'
        github-token: ${{ github.token }}
    - name: Pinned installer toolchain
      run: |
        dotnet tool install --global wix --version 5.0.2
        "$USERPROFILE/.dotnet/tools/wix" extension add --global WixToolset.Util.wixext/5.0.2
        choco install innosetup --version=6.5.4 --allow-downgrade --no-progress -y
        echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
    - name: Build per-user MSI and setup EXE from the audited ZIP
      run: python release/scripts/build_windows_installers.py build --tag "v0.1.1-preview.6" --archive native-windows/ilium-windows-x86_64.zip --work "$RUNNER_TEMP/installer-work" --output windows-installers
    - name: Silent install, run and uninstall both packages (add-on animations must be refused)
      run: python release/scripts/build_windows_installers.py smoke --tag "v0.1.1-preview.6" --installers windows-installers --archive native-windows/ilium-windows-x86_64.zip --audit-report native-windows/native-audit.json --manifest release/targets.toml --animation-contract refusal --log "D:/s"
    - name: Seal native installer evidence
      run: python release/scripts/validate_animation_smoke.py --workspace Cargo.toml --manifest release/targets.toml --target x86_64-pc-windows-msvc --tag "v0.1.1-preview.6" --audit native-windows/native-audit.json --archive native-windows/ilium-windows-x86_64.zip --packages windows-installers --animation-contract refusal --windows-journal "D:/s/smoke.jsonl"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: windows-installers
        path: windows-installers/
        if-no-files-found: error
        retention-days: '30'
    - name: Retain installer logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: diagnostics-windows-installers
        path: ${{ runner.temp }}/installer-work/
        if-no-files-found: warn
        retention-days: '30'
    - name: Retain smoke evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: diagnostics-windows-smoke
        path: D:/s/
        if-no-files-found: warn
        retention-days: '7'
