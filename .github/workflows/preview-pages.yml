# Preview installers are pinned to separately published prereleases. This is
# deliberately independent of the five-native-archive stable release pipeline.
name: Preview installer Pages
on:
  workflow_call:
    inputs:
      preview_tag:
        required: true
        type: string
      promote_production:
        required: true
        type: boolean
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
permissions:
  contents: read
env:
  # The checkout must stay clean: tracked bytecode files are audited as source.
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  pages:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      preview_url: ${{ steps.preview_url.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check preview Pages artifact and provider gate contracts
        run: python -m unittest release.tests.test_preview_pages
      - name: Build source-bound preview site and check published asset digests
        run: python release/scripts/preview_pages.py prepare --tag "$PREVIEW_TAG" --output "$RUNNER_TEMP/preview-site"
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ inputs.preview_tag }}
      - name: Record current production identity and exact served routes
        run: python release/scripts/preview_pages.py baseline --output "$RUNNER_TEMP/pages-baseline.json"
        env: &pages_credentials
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      - name: Deploy and verify preview URL
        run: >-
          python release/scripts/preview_pages.py deploy-preview
          --artifact "$RUNNER_TEMP/preview-site"
          --log "$RUNNER_TEMP/preview-pages.log"
          --output "$RUNNER_TEMP/preview-receipt.json"
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      - id: preview_url
        name: Export the verified preview origin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['RUNNER_TEMP']) / 'preview-receipt.json').read_text())
          print('url=' + receipt['url'].rstrip('/'))
          PY
      - name: Retain the source, baseline, upload and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-pages-evidence
          path: |
            ${{ runner.temp }}/preview-site/
            ${{ runner.temp }}/pages-baseline.json
            ${{ runner.temp }}/preview-pages*
            ${{ runner.temp }}/preview-receipt.json
          if-no-files-found: warn
          retention-days: 30
  posix-one-liners:
    needs: pages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            archive: ilium-linux-x86_64.tar.gz
          - runner: ubuntu-22.04-arm
            archive: ilium-linux-aarch64.tar.gz
          - runner: macos-15
            archive: ilium-macos-aarch64.tar.gz
          - runner: macos-15-intel
            archive: ilium-macos-x86_64.tar.gz
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preview-pages-evidence
          path: ${{ runner.temp }}/preview-evidence
      - name: Run and verify the preview-served POSIX one-liner on the native runner
        shell: bash
        env:
          PREVIEW_URL: ${{ needs.pages.outputs.preview_url }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          expected_version=$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'preview-evidence/preview-site/manifest.json').read_text())
          print(manifest['pins'][os.environ['ARCHIVE']]['version'])
          PY
          )
          if test "$expected_version" = 0.1.1-preview.7; then
            case "$ARCHIVE" in
              ilium-linux-*) expected_version=0.1.1-linux.3 ;;
              ilium-macos-aarch64.tar.gz) expected_version=0.1.1-preview.5 ;;
            esac
          fi
          mkdir -p "$RUNNER_TEMP/ilium-preview-home"
          HOME="$RUNNER_TEMP/ilium-preview-home" curl --proto '=https' --tlsv1.2 -LsSf "$PREVIEW_URL/install.sh" |
            HOME="$RUNNER_TEMP/ilium-preview-home" sh
          client="$RUNNER_TEMP/ilium-preview-home/.local/bin/ilium"
          server="$RUNNER_TEMP/ilium-preview-home/.local/bin/ilium-server"
          test -x "$client" && test -x "$server"
          test "$("$client" --version)" = "ilium $expected_version"
          test "$("$server" --version)" = "ilium-server $expected_version"
          case "$ARCHIVE" in
            ilium-linux-*) complete_payload_version=0.1.1-linux.3 ;;
            ilium-macos-aarch64.tar.gz) complete_payload_version=0.1.1-preview.5 ;;
            ilium-macos-x86_64.tar.gz) complete_payload_version=0.1.1-preview.7 ;;
            *) exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/ilium-complete-preview-home"
          curl --proto '=https' --tlsv1.2 -LsSf "$PREVIEW_URL/install.sh" |
            HOME="$RUNNER_TEMP/ilium-complete-preview-home" sh -s -- --version 0.1.1-preview.7
          client="$RUNNER_TEMP/ilium-complete-preview-home/.local/bin/ilium"
          server="$RUNNER_TEMP/ilium-complete-preview-home/.local/bin/ilium-server"
          test "$("$client" --version)" = "ilium $complete_payload_version"
          test "$("$server" --version)" = "ilium-server $complete_payload_version"
  windows-one-liner:
    needs: pages
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preview-pages-evidence
          path: ${{ runner.temp }}/preview-evidence
      - name: Run the preview-served PowerShell one-liner in the disposable runner profile
        shell: pwsh
        env:
          PREVIEW_URL: ${{ needs.pages.outputs.preview_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'preview-evidence/preview-site/manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $pin = $manifest.pins.PSObject.Properties['ilium-windows-x86_64.zip'].Value
          $releaseVersion = [string]$pin.version
          $payloadVersion = [string]$pin.payload_version
          if ($releaseVersion -cne '0.1.1-preview.7' -or $payloadVersion -cne '0.1.1-preview.6') {
            throw 'Windows release and payload pins do not match the carried preview archive'
          }
          $root = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'ilium'
          function Assert-InstalledPreview {
            if ((Get-Content -LiteralPath (Join-Path $root 'current') -Raw) -cne "$releaseVersion`n") {
              throw 'Installed Windows release pointer does not match the release pin'
            }
            foreach ($executable in @('ilium', 'ilium-server')) {
              $launcher = Join-Path $root ('bin/' + $executable + '.cmd')
              if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) { throw "Missing installed $executable launcher" }
              $output = & $launcher --version 2>&1
              if ($LASTEXITCODE -ne 0 -or ($output -join "`n").Trim() -cne "$executable $payloadVersion") {
                throw "Installed $executable launcher did not execute the pinned payload version"
              }
            }
            $helper = Join-Path $root ("versions/$releaseVersion/bin/ilium-animation-helper.exe")
            $output = & $helper --version 2>&1
            $expected = '{"type":"result","command":"version","name":"ilium-animation-helper","version":"' + $payloadVersion + '"}'
            if ($LASTEXITCODE -ne 0 -or @($output).Count -ne 1 -or [string]$output -cne $expected) {
              throw 'Installed animation helper did not execute the pinned payload version'
            }
          }
          irm "$env:PREVIEW_URL/install.ps1" | iex
          Assert-InstalledPreview
          $installerPath = Join-Path $env:RUNNER_TEMP 'ilium-preview-installer.ps1'
          Invoke-WebRequest -Uri "$env:PREVIEW_URL/install.ps1" -OutFile $installerPath
          & $installerPath -Version $releaseVersion
          Assert-InstalledPreview
  promote:
    if: inputs.promote_production
    needs: [pages, posix-one-liners, windows-one-liner]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preview-pages-evidence
          path: ${{ runner.temp }}/preview-evidence
      - name: Promote only the verified preview bytes after all five native one-liners pass
        run: >-
          python release/scripts/preview_pages.py promote
          --artifact "$RUNNER_TEMP/preview-evidence/preview-site"
          --preview-receipt "$RUNNER_TEMP/preview-evidence/preview-receipt.json"
          --baseline "$RUNNER_TEMP/preview-evidence/pages-baseline.json"
          --log "$RUNNER_TEMP/production-pages.log"
          --output "$RUNNER_TEMP/production-receipt.json"
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      - name: Record live production and preserve other writers if promotion fails
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/preview-evidence/pages-baseline.json"; then
            python release/scripts/preview_pages.py recover \
              --baseline "$RUNNER_TEMP/preview-evidence/pages-baseline.json" \
              --log "$RUNNER_TEMP/production-pages.log" \
              --output "$RUNNER_TEMP/recovery-receipt.json"
          fi
        env: *pages_credentials
      - name: Retain production promotion and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-pages-production-evidence
          path: |
            ${{ runner.temp }}/production-pages*
            ${{ runner.temp }}/production-receipt.json
            ${{ runner.temp }}/recovery-receipt.json
          if-no-files-found: warn
          retention-days: 30
