# Cross-platform build and test gate.
#
# Job layout follows the private-repository minute budget rather than
# convenience: GitHub bills macOS runners at roughly ten times the Linux rate
# and Windows at roughly 1.7x, so the macOS job is deliberately kept off pull
# requests and runs only on `master` pushes or an explicit manual dispatch.
# Linux is the fast inner loop and gates everything.
#
# Windows and macOS both build and run the suite. They still have failing
# tests while the port finishes, and they block on purpose: a red job here is
# the porting checklist, and every platform bug found so far -- a startup hang,
# panes that could not spawn, socket paths over the length limit -- was
# invisible to compilation and only surfaced by running on a real machine.

name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

# A newer push to the same ref makes the older run's minutes worthless; on a
# metered private repository, cancelling them is real money saved.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    # Incremental artifacts are pure overhead on a runner that never rebuilds
    # the same tree twice, and they bloat what the cache action has to store.
    CARGO_INCREMENTAL: 0
    RUST_BACKTRACE: 1

jobs:
    lint:
        name: Format and clippy (Linux)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            # `cpal` links against ALSA, so ilium-voice cannot build on a bare
            # runner image without the development headers.
            - name: Install Linux build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev pkg-config libssl-dev

            # rust-toolchain.toml drives the version; rustup on the runner
            # honours it automatically on the first cargo invocation.
            - name: Show toolchain
              run: |
                  rustc --version
                  cargo --version

            - uses: Swatinem/rust-cache@v2

            - name: cargo fmt --check
              run: cargo fmt --all --check

            # `-D warnings` is passed to clippy rather than set in RUSTFLAGS so
            # that a warning inside a third-party dependency cannot fail the
            # build; only this workspace's own code is held to the bar.
            - name: cargo clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

    test-linux:
        name: Test (Linux)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4

            - name: Install Linux build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev pkg-config libssl-dev

            - uses: Swatinem/rust-cache@v2

            - name: cargo build
              run: cargo build --workspace --all-targets

            # The live OpenAI tests carry `#[ignore]`; the default test run
            # skips them, so no API key ever needs to exist as a repo secret.
            #
            # `--no-fail-fast` for the same reason the Windows job uses it: one
            # run should report every crate, not stop at the first failure.
            - name: cargo test
              run: |
                  systemd-run --user --wait --pipe --collect \
                    --unit=ilium-ci-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
                    --property=Delegate=yes \
                    --working-directory="$GITHUB_WORKSPACE" \
                    --setenv="PATH=$PATH" \
                    --setenv="CARGO_TERM_COLOR=$CARGO_TERM_COLOR" \
                    --setenv="CARGO_INCREMENTAL=$CARGO_INCREMENTAL" \
                    --setenv="RUST_BACKTRACE=$RUST_BACKTRACE" \
                    --setenv="RUST_TEST_THREADS=$RUST_TEST_THREADS" \
                    --setenv="ILIUM_PTY_SMOKE_BINARY=$ILIUM_PTY_SMOKE_BINARY" \
                    --setenv="ILIUM_ANIMATION_HELPER=$ILIUM_ANIMATION_HELPER" \
                    --setenv="ILIUM_NAMING_EVIDENCE_DIR=$ILIUM_NAMING_EVIDENCE_DIR" \
                    /usr/bin/env cargo test --workspace --no-fail-fast
              env:
                # Process-heavy PTY tests contend with one another when Cargo
                # test binaries use the runner's full parallelism.
                RUST_TEST_THREADS: '1'
                ILIUM_PTY_SMOKE_BINARY: ${{ github.workspace }}/target/debug/ilium
                ILIUM_ANIMATION_HELPER: ${{ github.workspace }}/target/debug/ilium-animation-helper
                ILIUM_NAMING_EVIDENCE_DIR: ${{ runner.temp }}/ilium-naming-evidence

    test-windows:
        name: Test (Windows)
        runs-on: windows-latest
        # Longer than the other jobs: this runner has half the cores, and a
        # cancelled run saves no cache, so a rebuild here starts cold.
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4

            - uses: Swatinem/rust-cache@v2

            - name: cargo build
              run: cargo build --workspace --all-targets

            # `--no-fail-fast` so one run reports every crate instead of
            # stopping at the first failure, which is what makes this a porting
            # checklist rather than a one-bug-per-run drip.
            - name: cargo test
              run: cargo test --workspace --no-fail-fast
              env:
                # The Windows release lane also serializes process-heavy PTY
                # tests; otherwise child Ilium processes can exhaust their
                # runner stack while sibling tests spawn more processes.
                RUST_TEST_THREADS: '1'
                ILIUM_PTY_SMOKE_BINARY: ${{ github.workspace }}\target\debug\ilium.exe
                ILIUM_ANIMATION_HELPER: ${{ github.workspace }}\target\debug\ilium-animation-helper.exe

    test-macos:
        name: Test (macOS)
        # Skipped on pull requests purely for cost. Push to master or dispatch
        # this workflow by hand when a macOS answer is actually needed.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4

            - uses: Swatinem/rust-cache@v2

            - name: cargo build
              run: cargo build --workspace --all-targets

            # See the Linux job: report every crate rather than stopping at the
            # first failure.
            - name: cargo test
              run: cargo test --workspace --no-fail-fast
              env:
                # The process-heavy PTY tests need a private binary/evidence path
                # and serialized execution so first-exec detection can settle.
                RUST_TEST_THREADS: '1'
                ILIUM_PTY_SMOKE_BINARY: ${{ github.workspace }}/target/debug/ilium
                ILIUM_ANIMATION_HELPER: ${{ github.workspace }}/target/debug/ilium-animation-helper
                ILIUM_NAMING_EVIDENCE_DIR: ${{ runner.temp }}/ilium-naming-evidence
