[package]
name = "ilium-plugin-bench"
description = "Benchmark programs B1..B24 and budget tests of the Ilium plugin host (test-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ilium-plugin-host = { version = "0.1.1-linux.1", path = "../ilium-plugin-host", features = ["testing"] }
ilium-plugin-testkit = { version = "0.1.1-linux.1", path = "../ilium-plugin-testkit" }
# `BenchResult::to_json` returns a `serde_json::Value` (HST-301, HST-303).
serde_json = "1.0.151"

[dev-dependencies]
proptest = "1"
