[package]
name = "ilium-remote-compaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compacts a Claude Code or Codex session transcript by summarizing it through an injected model and writing the result back in the agent's own format"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ilium-agent-session = { version = "0.1.1", path = "../ilium-agent-session" }
ilium-prompts = { version = "0.1.1", path = "../ilium-prompts" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
uuid = { version = "1.23.5", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
