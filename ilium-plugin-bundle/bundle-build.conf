# Settings of the ilium-plugin-bundle build script, for builds that cannot pass environment
# variables (the remote build service forwards none). One `key = value` per line; `#` starts
# a comment. An environment variable, when set and not empty, overrides its key.
#
# mode        skip | lenient | strict                  (ILIUM_PLUGIN_BUNDLE_MODE)
#               skip     build no component; the catalogue lists manifests only
#               lenient  build what compiles; the rest is listed in MISSING
#               strict   a component that does not compile fails the build
# locked      true | false                             (ILIUM_PLUGIN_BUNDLE_LOCKED)
#               true passes --locked to the nested cargo; false lets it complete Cargo.lock
# offline     true | false                             (ILIUM_PLUGIN_BUNDLE_OFFLINE)
#               true passes --offline to the nested cargo
# target-dir  a directory, empty for the default       (ILIUM_PLUGIN_BUNDLE_TARGET_DIR)
#               target directory of the nested wasm builds; absolute, or relative to the
#               workspace root. Name one that outlives the outer target directory to keep
#               the wasm build incremental across clean checkouts.

mode = skip
locked = true
offline = false
target-dir =
