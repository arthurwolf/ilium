[package]
name = "ilium"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Optional GPU rendering for background animations: cargo build --release --features gpu
gpu = ["ilium-client/gpu"]

[dependencies]
anyhow = "1.0.103"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
sha2 = "0.10.9"
ilium-agent-session = { version = "0.1.1", path = "../ilium-agent-session" }
ilium-client = { version = "0.1.1", path = "../ilium-client" }
ilium-inference = { version = "0.1.1", path = "../ilium-inference" }
ilium-pty = { version = "0.1.1", path = "../ilium-pty" }
ilium-core = { version = "0.1.1", path = "../ilium-core" }
ilium-control = { version = "0.1.1", path = "../ilium-control" }
ilium-ipc = { version = "0.1.1", path = "../ilium-ipc" }
ilium-plugin-host = { version = "0.1.1", path = "../ilium-plugin-host" }
ilium-logging = { version = "0.1.1", path = "../ilium-logging" }
ilium-transport = { version = "0.1.1", path = "../ilium-transport" }
ilium-platform = { version = "0.1.1", path = "../ilium-platform" }
regex = "1.12.3"
serde_json = "1.0.151"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1.44"

[dev-dependencies]
# Plugin platform test lanes (test-plan.md section 1.5).
ilium-plugin-host = { version = "0.1.1", path = "../ilium-plugin-host", features = ["testing"] }
ilium-plugin-testkit = { version = "0.1.1", path = "../ilium-plugin-testkit" }
proptest = "1"
ilium-ambient = { version = "0.1.1", path = "../ilium-ambient" }
ilium-test-fixtures = { version = "0.1.1", path = "../ilium-test-fixtures" }
sysinfo = "0.39.6"
tempfile = "3.27.0"
unicode-width = "0.2.1"
tokio = { version = "1", features = ["process", "io-util"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.33"
vt100 = "0.16.2"
