[package]
name = "ilium-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ilium-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.8", features = ["json"] }
crossterm = "0.29.0"
directories = "6.0.0"
ilium-agent-debug = { version = "0.1.0", path = "../ilium-agent-debug" }
ilium-agent-session = { version = "0.1.0", path = "../ilium-agent-session" }
ilium-core = { version = "0.1.0", path = "../ilium-core" }
ilium-detect = { version = "0.1.0", path = "../ilium-detect" }
ilium-ipc = { version = "0.1.0", path = "../ilium-ipc" }
ilium-logging = { version = "0.1.0", path = "../ilium-logging" }
ilium-pty = { version = "0.1.0", path = "../ilium-pty" }
ilium-sound = { version = "0.1.0", path = "../ilium-sound" }
notify-rust = "4.18.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_norway = "0.9.42"
sysinfo = "0.39.6"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "signal"] }
toml = "0.8.23"
tracing = "0.1.44"
uuid = { version = "1.23.5", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
