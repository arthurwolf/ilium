[package]
name = "ilium-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ilium-server"
path = "src/main.rs"

[dependencies]
ilium-prompts = { version = "0.1.1", path = "../ilium-prompts" }
axum = { version = "0.8.8", features = ["json"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
directories = "6.0.0"
ilium-agent-debug = { version = "0.1.1", path = "../ilium-agent-debug" }
ilium-agent-session = { version = "0.1.1", path = "../ilium-agent-session" }
ilium-core = { version = "0.1.1", path = "../ilium-core" }
ilium-detect = { version = "0.1.1", path = "../ilium-detect" }
ilium-execution = { version = "0.1.1", path = "../ilium-execution" }
ilium-git = { version = "0.1.1", path = "../ilium-git" }
ilium-ipc = { version = "0.1.1", path = "../ilium-ipc" }
ilium-plugin-host = { version = "0.1.1", path = "../ilium-plugin-host" }
ilium-plugin-api = { version = "0.1.1", path = "../ilium-plugin-api" }
ilium-logging = { version = "0.1.1", path = "../ilium-logging" }
ilium-platform = { version = "0.1.1", path = "../ilium-platform" }
ilium-pty = { version = "0.1.1", path = "../ilium-pty" }
ilium-sound = { version = "0.1.1", path = "../ilium-sound" }
ilium-transport = { version = "0.1.1", path = "../ilium-transport" }
ignore = "0.4.33"
notify-rust = "4.18.0"
regex = "1.12.3"
regex-automata = "0.4.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_norway = "0.9.42"
sysinfo = "0.39.6"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs", "signal", "process"] }
toml = "0.8.23"
tracing = "0.1.44"
uuid = { version = "1.23.5", features = ["v4"] }
vt100 = "0.16.2"
walkdir = "2.5.0"

[dev-dependencies]
# Plugin platform test lanes (test-plan.md section 1.5).
ilium-plugin-host = { version = "0.1.1", path = "../ilium-plugin-host", features = ["testing"] }
ilium-plugin-testkit = { version = "0.1.1", path = "../ilium-plugin-testkit" }
proptest = "1"
ilium-test-fixtures = { version = "0.1.1", path = "../ilium-test-fixtures" }
tempfile = "3.27.0"
