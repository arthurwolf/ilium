[workspace]
resolver = "2"
members = [
    "ilium-animation-js",
    "ilium-wikipedia",
    "ilium-ambient",
    "ilium-agent-debug",
    "ilium-agent-session",
    "ilium-client",
    "ilium-control",
    "ilium-compaction-analysis",
    "ilium-core",
    "ilium-detect",
    "ilium-execution",
    "ilium-git",
    "ilium-gpu",
    "ilium-http",
    "ilium-ipc",
    "ilium-inference",
    "ilium-kilo-gateway",
    "ilium-logging",
    "ilium-platform",
    "ilium-prompts",
    "ilium-pty",
    "ilium-remote-compaction",
    "ilium-test-fixtures",
    "ilium-transport",
    "ilium-server",
    "ilium-session-convert",
    "ilium-sound",
    "ilium-voice",
    "ilium",
    # Plugin platform (docs/research/plugin-platform/test-plan.md section 1.1). The test-only
    # crates ilium-plugin-conformance and ilium-plugin-bench join when their lanes create them,
    # and so does "plugins/fixtures/*" (Cargo rejects a member glob that matches no crate).
    "ilium-plugin-api",
    "ilium-plugin-host",
    "ilium-plugin-precompile",
    "ilium-plugin-helper",
    "ilium-plugin-sdk-core",
    "ilium-plugin-sdk-macros",
    "ilium-plugin-sdk",
    "ilium-plugin-testkit",
    "ilium-plugin-conformance",
    "ilium-plugin-bench",
    "plugins/core/*",
    "plugins/fixtures/*",
]
# The patched third-party crate remains a dependency, not an ilium workspace
# package; this also lets its own upstream-style unit tests run independently.
exclude = [
    "vendor/vt100",
    "vendor/crossterm-0.29.0",
    "vendor/ratatui-image-11.0.6",
]

[workspace.package]
version = "0.1.1-linux.1"
edition = "2021"
rust-version = "1.96.0"
license = "MIT"
repository = "https://github.com/arthurwolf/ilium"

# vt100 0.16.2 can retain an orphaned wide cell after a shrinking resize,
# then panic when a later erase sequence clears that row. Upstream issue #28
# and PR #30 contain the unreleased fix; keep the shared client/server repair
# local and reproducible until a fixed crate release exists.
[workspace.dependencies]
wasmtime = { version = "=49.0.2", default-features = false }

[patch.crates-io]
vt100 = { path = "vendor/vt100" }
crossterm = { path = "vendor/crossterm-0.29.0" }
ratatui-image = { path = "vendor/ratatui-image-11.0.6" }
