[package]
name = "illium-ipc"
version.workspace = true
edition.workspace = true

[dependencies]
bincode = "1.3.3"
illium-core = { version = "0.1.0", path = "../illium-core" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["io-util", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread"] }
