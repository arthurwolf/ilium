# Vendored fork of tui-tree-widget 0.24.0 (from crates.io), patched to
# halve the per-depth indent and render it as a dark-grey guide glyph
# instead of blank spaces -- upstream hardcodes `depth * 2` raw spaces
# in its render loop with no builder option to override it.

[package]
edition = "2024"
rust-version = "1.86"
name = "tui-tree-widget"
version = "0.24.0-ilium.1"
authors = ["EdJoPaTo <tui-tree-widget-rust-crate@edjopato.de>"]
build = false
include = [
    "src/**/*",
    "examples/**/*",
    "benches/**/*",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Tree Widget for ratatui"
readme = "README.md"
keywords = [
    "tui",
    "terminal",
    "tree",
    "widget",
]
categories = ["command-line-interface"]
license = "MIT"
repository = "https://github.com/EdJoPaTo/tui-rs-tree-widget"

[lib]
name = "tui_tree_widget"
path = "src/lib.rs"

[[example]]
name = "example"
path = "examples/example.rs"

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[dependencies.ratatui-core]
version = "0.1.0"
default-features = false

[dependencies.ratatui-widgets]
version = "0.3.0"

[dependencies.unicode-width]
version = "0.2"

[dev-dependencies.criterion]
version = "0.8"

[dev-dependencies.ratatui]
version = "0.30"

[lints.clippy]
allow_attributes = "warn"
min_ident_chars = "warn"
std_instead_of_core = "warn"
unused_trait_names = "warn"

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[profile.bench]
lto = true
codegen-units = 1
debug = 2
