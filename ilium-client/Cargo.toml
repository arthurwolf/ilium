[package]
name = "ilium-client"
version.workspace = true
edition.workspace = true

[lib]
name = "ilium_client"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.103"
arboard = "3.6.1"
crossterm = "0.29.0"
cosmic-text = "0.14"
directories = "6.0.0"
handlebars = "6.3.2"
ilium-agent-session = { version = "0.1.0", path = "../ilium-agent-session" }
ilium-core = { version = "0.1.0", path = "../ilium-core" }
ilium-ipc = { version = "0.1.0", path = "../ilium-ipc" }
ilium-inference = { version = "0.1.0", path = "../ilium-inference" }
ilium-sound = { version = "0.1.0", path = "../ilium-sound" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
pulldown-cmark = "0.13"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.0", default-features = false }
ratatui-textarea = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_norway = "0.9.42"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
toml = "0.8.23"
tracing = "0.1.44"
tui-term = "0.3.4"
tui-tree-widget = { path = "vendor/tui-tree-widget" }
vt100 = "0.16.2"
two-face = "0.5.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig", "parsing", "dump-load"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
