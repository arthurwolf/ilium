[package]
name = "ilium-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bincode = "1.3.3"
ilium-agent-debug = { version = "0.1.1-linux.1", path = "../ilium-agent-debug" }
ilium-core = { version = "0.1.1-linux.1", path = "../ilium-core" }
ilium-sound = { version = "0.1.1-linux.1", path = "../ilium-sound" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["io-util", "macros"] }

[dev-dependencies]
# Plugin platform test lanes (test-plan.md section 1.5).
ilium-plugin-host = { version = "0.1.1-linux.1", path = "../ilium-plugin-host", features = ["testing"] }
ilium-plugin-testkit = { version = "0.1.1-linux.1", path = "../ilium-plugin-testkit" }
proptest = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread"] }
toml = "0.8.23"
