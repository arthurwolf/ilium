[package]
name = "ilium-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bincode = "1.3.3"
ilium-agent-debug = { version = "0.1.0", path = "../ilium-agent-debug" }
ilium-core = { version = "0.1.0", path = "../ilium-core" }
ilium-sound = { version = "0.1.0", path = "../ilium-sound" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["io-util", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread"] }
