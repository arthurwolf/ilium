# Pins one toolchain for local development and CI alike, so a clippy lint or
# formatting rule that passes on a developer machine cannot fail on a runner
# (or the reverse) purely because the two resolved different `stable` builds.
[toolchain]
channel = "1.96.1"
components = ["clippy", "rustfmt"]
# Core plugins are WebAssembly components (ilium-plugin-bundle builds them).
targets = ["wasm32-wasip2"]
