[package]
name = "ilium-voice"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22.1"
cpal = "0.18.1"
futures-util = "0.3.33"
ilium-logging = { version = "0.1.0", path = "../ilium-logging" }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
