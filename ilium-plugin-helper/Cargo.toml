[package]
name = "ilium-plugin-helper"
description = "Sandbox helper process of the Ilium plugin platform: runs T2 and T3 plugins outside the server and client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ilium_plugin_helper"
path = "src/lib.rs"

[[bin]]
name = "ilium-plugin-helper"
path = "src/main.rs"

# Skeleton state: Wasmtime is added by the implementation phase with the code that uses it
# (test plan section 1.3); the skeleton public surface has no engine types.
[dependencies]
ilium-plugin-api = { version = "0.1.1", path = "../ilium-plugin-api" }
ilium-platform = { version = "0.1.1", path = "../ilium-platform" }
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
