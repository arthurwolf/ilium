[package]
name = "ilium-test-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Test-support only. Nothing in the shipped binary depends on this crate; it
# exists so the fake agent CLIs the integration tests spawn are real
# executables that build for whatever platform the suite is running on,
# instead of `#!/bin/sh` scripts that confine those tests to Unix.

[dependencies]
crossterm = "0.29.0"
ilium-platform = { version = "0.1.1", path = "../ilium-platform" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
ilium-pty = { version = "0.1.1", path = "../ilium-pty" }
tempfile = "3.27.0"
vt100 = "0.16.2"

# `harness = false`: `cargo test` compiles this bin into `deps/` in test mode,
# and by default that build runs libtest's `main`, which rejects the fake CLI's
# own argv (`--resume`) and exits before any pane detection can see it. Without
# the harness the fixture's own `main` runs, as the tests expect.
#
# `test = false`: with the harness off, `cargo test` would still run this bin as
# a test target, which executes the fixture's `main` with no behaviour file and
# fails the run before the integration tests start. The bin has no unit tests,
# so skipping it loses nothing; the integration tests still get it built.
[[bin]]
name = "ilium-fixture-agent"
path = "src/bin/ilium_fixture_agent.rs"
harness = false
test = false
