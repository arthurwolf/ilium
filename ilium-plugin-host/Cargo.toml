[package]
name = "ilium-plugin-host"
description = "Plugin host of Ilium: engine, dispatcher, registries, package installer, lifecycle and the `ilium plugin` commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Skeleton state: Wasmtime, the signing and archive crates (`ed25519-dalek`, `sha2`, `base64`,
# `regex`, `globset`) and the registry HTTP stack are added by the implementation phase together
# with the code that uses them (test plan section 1.3). The skeleton has no engine types in its
# public surface, so it builds without them.
[dependencies]
ilium-plugin-api = { version = "0.1.1", path = "../ilium-plugin-api" }
ilium-execution = { version = "0.1.1", path = "../ilium-execution" }
ilium-platform = { version = "0.1.1", path = "../ilium-platform" }
ilium-logging = { version = "0.1.1", path = "../ilium-logging" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt", "sync", "time"] }
loom = { version = "0.7", optional = true }

[dev-dependencies]
# Test lanes of the plugin platform (test-plan.md sections 2.4 and 2.13).
proptest = "1"
# Signatures with other keys, prefixes and malformed scalars in the package lane (PKG-203, PKG-250..252).
ed25519-dalek = "2"
tempfile = "3.27.0"
toml = "0.8.23"

[features]
# FakeKernel, NativeGuest, WAT loader and HostHarness for host and conformance tests.
testing = []
# Maps the `sync` shim to loom types for the loom model tests (test plan section 2.7).
loom = ["dep:loom"]
