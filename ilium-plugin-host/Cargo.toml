[package]
name = "ilium-plugin-host"
description = "Plugin host of Ilium: engine, dispatcher, registries, package installer, lifecycle and the `ilium plugin` commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
subtle = "2.6.1"
unicode-normalization = "0.1"
serde_json_canonicalizer = "0.3.2"
ed25519-dalek = "2"
base64 = "0.22.1"
regex = "1.12.3"
ilium-plugin-api = { version = "0.1.1", path = "../ilium-plugin-api" }
ilium-execution = { version = "0.1.1", path = "../ilium-execution" }
ilium-platform = { version = "0.1.1", path = "../ilium-platform" }
ilium-logging = { version = "0.1.1", path = "../ilium-logging" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"
semver = "1.0.28"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt", "sync", "time"] }
loom = { version = "0.7", optional = true }
wasmtime = { workspace = true, default-features = false, features = ["async", "cache", "component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmparser = "=0.258.3"
sha2 = "0.10.9"
flate2 = "1.1.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
wat = { version = "=1.258.3", optional = true }

[dev-dependencies]
zip = "8.6"
# Test lanes of the plugin platform (test-plan.md sections 2.4 and 2.13).
proptest = "1"
tempfile = "3.27.0"
# `ilium_plugin_testkit::manual::pages_dir()` in the documentation-lint tests (DEV-762, DEV-780).
ilium-plugin-testkit = { version = "0.1.1", path = "../ilium-plugin-testkit" }

[features]
# FakeKernel, NativeGuest, WAT loader and HostHarness for host and conformance tests.
testing = ["dep:wat"]
# Maps the `sync` shim to loom types for the loom model tests (test plan section 2.7).
loom = ["dep:loom"]
